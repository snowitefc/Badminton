<style id="room-first-css">
/* ===== ROOM-FIRST WELCOME SCREEN ===== */
#welcome-screen {
  position:fixed;inset:0;z-index:9999;

  padding:20px;

}

/* Logo */

.w-title {
  text-align:center;font-size:20px;font-weight:900;

}

/* Steps */

/* ── RECENT ROOM CHIP ── */

<script id="room-first-js">
// ═══════════════════════════════════════════════════════════════════
//  ROOM-FIRST AUTH MODULE
//  Philosophy: Enter room → identify yourself → play.
//  Google login is ONLY required for Admin (room creation).
//  Members use Firebase Anonymous auth + a localStorage nickname.
// ═══════════════════════════════════════════════════════════════════

// ── internal state ──────────────────────────────────────────────
var _rfJoinCode    = '';   // room code being joined
var _rfNewCode     = '';   // room code just created
var _rfClaimedId   = null; // member id selected in claim grid
var _rfUser        = null; // Firebase user (anonymous or Google)

// ── Step router ──────────────────────────────────────────────────
function wGoStep(id) {
  document.querySelectorAll('.w-step').forEach(el => el.classList.remove('on'));
  const el = document.getElementById('ws-' + id);
  if (el) el.classList.add('on');
  if (id === 'home') _rfShowRecentChip();
}

// ── Recent room chip ─────────────────────────────────────────────
function _rfShowRecentChip() {
  const code = localStorage.getItem('bcm_last_room_code');
  const club = localStorage.getItem('bcm_last_club_name');
  const chip = document.getElementById('w-recent-chip');
  if (!chip || !code) return;
  document.getElementById('w-recent-club').textContent = club || 'ก๊วน';
  document.getElementById('w-recent-code').textContent = 'รหัส: ' + code;
  chip.style.display = 'block';
  // Auto-fill input
  const inp = document.getElementById('w-code-input');
  if (inp && !inp.value) {
    inp.value = code;
    wOnCodeInput(code);
  }
}

function wRejoinRecent() {
  const code = localStorage.getItem('bcm_last_room_code');
  if (!code) return;
  const inp = document.getElementById('w-code-input');
  if (inp) { inp.value = code; wOnCodeInput(code); }
  wEnterRoom();
}

// ── Room code input live validation ──────────────────────────────
function wOnCodeInput(val) {
  const btn = document.getElementById('w-enter-btn');
  const hint = document.getElementById('w-code-hint');
  if (val.length === 4) {
    if (btn) btn.disabled = false;
    if (hint) { hint.textContent = ''; hint.style.color = ''; }
  } else {
    if (btn) btn.disabled = true;
    if (hint) { hint.textContent = 'กรอกรหัสห้อง 4 หลัก'; hint.style.color = ''; }
  }
}

// ── ENTER ROOM — main flow for members ───────────────────────────
async function wEnterRoom() {
  const inp = document.getElementById('w-code-input');
  const code = (inp ? inp.value : '').trim();
  if (!code || !/^\d{4}$/.test(code)) {
    inp && inp.classList.add('error');
    setTimeout(() => inp && inp.classList.remove('error'), 400);
    return;
  }

  const btn = document.getElementById('w-enter-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="w-spin"></span> กำลังตรวจสอบ...'; }

  try {
    // 1. Verify room exists
    const _db = window.db;
    let roomExists = true;
    let roomData = null;
    if (_db) {
      try {
        const snap = await Promise.race([
          _db.ref('rooms/' + code).once('value'),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 5000))
        ]);
        roomExists = snap.exists();
        if (roomExists) roomData = snap.val();
      } catch(e) {
        // Timeout or network — allow entry optimistically
        roomExists = true;
      }
    }

    if (!roomExists) {
      const hint = document.getElementById('w-code-hint');
      if (hint) { hint.textContent = '❌ ไม่พบรหัสห้องนี้'; hint.style.color = 'var(--red)'; }
      inp && inp.classList.add('error');
      setTimeout(() => inp && inp.classList.remove('error'), 400);
      if (btn) { btn.disabled = false; btn.innerHTML = '🏸 เข้าร่วม'; }
      return;
    }

    _rfJoinCode = code;

    // 2. Load room data & proceed to identify step
    if (roomData) {
      const toArr = v => !v ? [] : Array.isArray(v) ? v : Object.values(v);
      const st = roomData.state || {};
      S.members     = toArr(st.members);
      S.matches     = toArr(st.matches);
      S.finance     = toArr(st.finance);
      S.decayEvents = toArr(st.decayEvents);
      S.seasons     = toArr(st.seasons);
      if (st.rsvp)        S.rsvp = st.rsvp;
      if (st.seasonGoal)  S.seasonGoal = st.seasonGoal;
      if (st.rulesConfig) Object.assign(RC, st.rulesConfig);
      if (roomData.clubName) {
        setClubName(roomData.clubName);
        _sSet('bcm_clubname', roomData.clubName);
      }
    }

    // 3. Go to nickname/claim step
    _rfShowNicknameStep(code);

  } catch(e) {
    toast('เกิดข้อผิดพลาด: ' + (e.message || e), '❌');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '🏸 เข้าร่วม'; }
  }
}

function _rfShowNicknameStep(code) {
  // Update UI labels
  const codeEl = document.getElementById('ws-nick-code');
  const clubEl = document.getElementById('ws-nick-club');
  if (codeEl) codeEl.textContent = code;
  if (clubEl) clubEl.textContent = getClubName() || '';

  const claimSection = document.getElementById('ws-claim-section');
  const nickSection  = document.getElementById('ws-nick-section');
  const claimGrid    = document.getElementById('ws-claim-grid');
  const toggleLink   = document.getElementById('ws-claim-toggle-link');

  // Check if there are unclaimed members to show the "Who are you?" grid
  const unclaimed = S.members.filter(m => !m.sessionId);
  // Also check if user already has a saved session for this room
  const savedSession = _rfGetSavedSession(code);

  if (savedSession) {
    // Returning user — auto-enter
    _rfEnterWithSession(code, savedSession);
    return;
  }

  if (unclaimed.length > 0 && claimGrid) {
    // Show claim grid
    claimGrid.innerHTML = unclaimed.map(m => {
      const icon = m.icon || '👤';
      return `<div class="w-claim-card" id="wcc-${m.id}" onclick="wSelectClaim(${m.id})">
        <div class="w-claim-icon">${icon}</div>
        <div class="w-claim-name">${esc(m.name)}</div>
      </div>`;
    }).join('');
    // Guest option
    claimGrid.innerHTML += `<div class="w-claim-card" id="wcc-guest" onclick="wShowNickInput()">
      <div class="w-claim-icon">👤</div>
      <div class="w-claim-name">Guest</div>
    </div>`;

    if (claimSection) claimSection.style.display = 'block';
    if (nickSection) nickSection.style.display = 'none';
    if (toggleLink) toggleLink.style.display = 'none';
  } else {
    // No members yet, or all claimed — go straight to nick input
    if (claimSection) claimSection.style.display = 'none';
    if (nickSection)  nickSection.style.display = 'block';
  }

  wGoStep('nickname');
}

// ── Session helpers ──────────────────────────────────────────────
function _rfMakeSessionId() {
  return 'sid_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
}

function _rfSaveSession(code, sessionId, nick, memberId) {
  // Per-room session stored in localStorage
  const sessions = JSON.parse(localStorage.getItem('bcm_sessions') || '{}');
  sessions[code] = { sessionId, nick, memberId, ts: Date.now() };
  localStorage.setItem('bcm_sessions', JSON.stringify(sessions));
  // Also persist last room
  localStorage.setItem('bcm_last_room_code', code);
  localStorage.setItem('bcm_last_club_name', getClubName() || '');
}

function _rfGetSavedSession(code) {
  try {
    const sessions = JSON.parse(localStorage.getItem('bcm_sessions') || '{}');
    const s = sessions[code];
    if (!s) return null;
    // Expire sessions older than 7 days (casual app — not too aggressive)
    if (Date.now() - s.ts > 7 * 24 * 60 * 60 * 1000) return null;
    return s;
  } catch(e) { return null; }
}

function _rfClearSession(code) {
  try {
    const sessions = JSON.parse(localStorage.getItem('bcm_sessions') || '{}');
    delete sessions[code];
    localStorage.setItem('bcm_sessions', JSON.stringify(sessions));
  } catch(e) {}
}

// ── Firebase Anonymous Auth + enter room ────────────────────────
async function _rfFinishJoin(code, nick, role, sessionId) {
  _sSet('bcm_roomCode', code);
  _sSet('bcm_role', role);
  _sSet('bcm_welcomed', '1');
  // Store nickname for profile display
  _sSet('bcm_adminName', nick);
  // Store session id in _session for this tab
  window._session.myUid = sessionId;

  // Firebase anonymous auth (no account required, just a UID for presence)
  const _auth = window._auth;
  if (_auth && !_auth.currentUser) {
    try {
      await _auth.signInAnonymously();
    } catch(e) {
      // Anonymous auth may be disabled — continue without it
      console.warn('[BCM] Anonymous auth failed:', e?.code);
    }
  }

  // If user claimed a member, attach presence/sessionId
  if (_rfClaimedId) {
    const m = gm(_rfClaimedId);
    if (m && !m.sessionId) {
      m.sessionId = sessionId;
      // Sync to Firebase so other clients see the claim
      try {
        const _db = window.db;
        if (_db && code) {
          await _db.ref('rooms/' + code + '/state/members').once('value').then(snap => {
            // lightweight: just update this member's sessionId
          });
        }
      } catch(e) {}
    }
    // Store myUid as memberId for role lookups
    window._session.myUid = sessionId;
  }

  _wSaveLastRoom(code, getClubName() || '');
  _hideWelcome();
  _afterAuth();
  if (typeof restartRealtimeSync === 'function') restartRealtimeSync();

  const greeting = nick ? ('ยินดีต้อนรับ ' + nick + ' 🏸') : ('เข้าห้อง ' + code + ' แล้ว 🏸');
  toast(greeting, '🏸');
}

}

async function wCreateClub() {
  const name = (document.getElementById('ws-club-name-input')?.value || '').trim();
  if (!name) {
    const inp = document.getElementById('ws-club-name-input');
    if (inp) { inp.style.borderColor = 'var(--red)'; setTimeout(() => inp.style.borderColor = '', 1000); inp.focus(); }
    return;
  }

  const user = _rfUser || _wUser;
  if (!user) { toast('กรุณา Sign in ก่อน', '⚠️'); return; }

  // Generate unique room code
  let code, tries = 0;
  const _db = window.db;
  do {
    code = String(Math.floor(1000 + Math.random() * 9000));
    tries++;
    if (tries > 10) break;
    if (_db) {
      const snap = await _db.ref('rooms/' + code).once('value');
      if (!snap.exists()) break;
    } else { break; }
  } while(true);

  _rfNewCode = code;

  // Save to Firebase
  if (_db) {
    try {
      await _db.ref('rooms/' + code).set({
        createdAt: Date.now(),
        adminUid:  user.uid,
        adminName: user.displayName || '',
        clubName:  name,
        state: { ...S, clubName: name, lastUpdatedAt: Date.now() },
      });
      await _db.ref('users/' + user.uid).set({
        roomCode: code, role: 'admin',
        name: user.displayName || '', email: user.email || '',
        joinedAt: Date.now(),
      });
      await _db.ref('adminRooms/' + user.uid).set(code);
    } catch(e) {
      console.error('[BCM] create room error:', e);
    }
  }

  setClubName(name);

  // Show success step
  const codeEl = document.getElementById('ws-new-code');
  if (codeEl) codeEl.textContent = code;
  wGoStep('created');
}

// ── Returning Admin — bypass welcome screen ──────────────────────
// Called by onAuthStateChanged when Google user is detected
async function _rfHandleReturningAdmin(user) {
  _wUser = user;
  const _db = window.db;
  const ws  = document.getElementById('welcome-screen');

  try {
    const userSnap = await Promise.race([
      _db.ref('users/' + user.uid).once('value'),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))
    ]);
    const userData = userSnap.val();
    if (userData && userData.roomCode && userData.role === 'admin') {
      const code = userData.roomCode;
      _sSet('bcm_roomCode', code);
      _sSet('bcm_role', 'admin');
      _sSet('bcm_myUid', user.uid);
      _sSet('bcm_adminUid', user.uid);
      _sSet('bcm_adminName', user.displayName || '');
      _sSet('bcm_adminEmail', user.email || '');
      _sSet('bcm_adminPhoto', user.photoURL || '');

      // Load room data
      const roomSnap = await _db.ref('rooms/' + code).once('value');
      const roomData = roomSnap.val();
      if (roomData) {
        const toArr = v => !v ? [] : Array.isArray(v) ? v : Object.values(v);
        if (roomData.clubName) { setClubName(roomData.clubName); _sSet('bcm_clubname', roomData.clubName); }
        const st = roomData.state || {};
        S.members     = toArr(st.members);
        S.matches     = toArr(st.matches);
        S.finance     = toArr(st.finance);
        S.decayEvents = toArr(st.decayEvents);
        S.seasons     = toArr(st.seasons);
        if (st.rulesConfig) Object.assign(RC, st.rulesConfig);
      }
      _wSaveLastRoom(code, getClubName() || '');
      if (ws) { ws.classList.add('hide'); setTimeout(() => ws.style.display = 'none', 420); }
      _afterAuth();
      if (typeof restartRealtimeSync === 'function') setTimeout(restartRealtimeSync, 300);
      return true; // handled
    }
  } catch(e) {
    console.warn('[BCM] returning admin lookup error:', e?.message);
  }
  return false; // not handled — show home
}

<script id="room-first-auth-observer">
/*
  NEW onAuthStateChanged — replaces the old one at ~line 4334.

  Decision tree:
  A) No user at all  → check localStorage session → show home or enter room silently
  B) Anonymous user  → already handled by _rfRestoreLocalSession / _rfFinishJoin
  C) Google user     → check if admin, bypass welcome if yes
*/
(function _rfPatchAuthObserver() {
  // Wait for _auth to be ready (it's set by the Firebase init block above this)
  function _patch() {
    if (!window._auth) { setTimeout(_patch, 100); return; }
    window._auth.onAuthStateChanged(async function(user) {
      _authResolved = true;
      const ws = document.getElementById('welcome-screen');

      // ── Case A: No user ──────────────────────────────────────
      if (!user) {
        // Check if we have a valid localStorage session (member flow)
        const savedCode = localStorage.getItem('bcm_last_room_code');
        const sessions  = JSON.parse(localStorage.getItem('bcm_sessions') || '{}');
        const s = savedCode && sessions[savedCode];
        const isValid = s && (Date.now() - s.ts < 7 * 24 * 60 * 60 * 1000);

        if (isValid && savedCode) {
          // Restore member session silently — no Google auth needed
          _sSet('bcm_roomCode', savedCode);
          _sSet('bcm_role', 'user');
          _sSet('bcm_welcomed', '1');
          _sSet('bcm_adminName', s.nick || '');
          window._session.myUid = s.sessionId || '';
          if (ws) { ws.classList.add('hide'); setTimeout(() => ws.style.display = 'none', 420); }
          _afterAuth();
          if (typeof restartRealtimeSync === 'function') setTimeout(restartRealtimeSync, 300);
        } else {
          // No session — show welcome home
          if (ws) { ws.style.display = ''; ws.classList.remove('hide'); }
          wGoStep('home');
        }
        return;
      }

      // ── Case B: Anonymous user ───────────────────────────────
      if (user.isAnonymous) {
        // Already handled by _rfFinishJoin — just mark auth resolved
        _wUser = user;
        const savedCode = _sGet('bcm_roomCode');
        if (savedCode && _sGet('bcm_welcomed')) {
          if (ws) { ws.classList.add('hide'); setTimeout(() => ws.style.display = 'none', 420); }
          _afterAuth();
          if (typeof restartRealtimeSync === 'function') setTimeout(restartRealtimeSync, 200);
        } else {
          if (ws) { ws.style.display = ''; ws.classList.remove('hide'); }
          wGoStep('home');
        }
        return;
      }

      // ── Case C: Google user (Admin) ──────────────────────────
      _wUser = user;
      const _db = window.db;
      if (_db) {
        const handled = await _rfHandleReturningAdmin(user);
        if (handled) return;
      }

      // Google user but no room found — show admin create or home
      if (ws) { ws.style.display = ''; ws.classList.remove('hide'); }
      // Pre-fill admin details for create flow
      const nameEl  = document.getElementById('ws-admin-name');
      const emailEl = document.getElementById('ws-admin-email');
      if (nameEl)  nameEl.textContent  = user.displayName || '—';
      if (emailEl) emailEl.textContent = user.email || '—';
      wGoStep('create-club');
    });
  }
  _patch();
})();
</script>
